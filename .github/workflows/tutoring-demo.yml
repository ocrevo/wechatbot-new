name: Tutoring demo offline checks

on:
  push:
    branches: [demo/tutoring-consultation]
  pull_request:

permissions:
  contents: read

jobs:
  offline-tests:
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: '3.12'
      - name: Test consultation, event deduplication and uncertain-send handling
        env:
          PYTHONUTF8: '1'
        run: python -m unittest discover -s tests -v
      - name: Check source syntax without importing WeChat automation
        run: |
          @'
          import ast
          from pathlib import Path
          for root in (Path('tutoring_demo'), Path('vendor/wechatauto-replica/wechatauto')):
              for source in root.rglob('*.py'):
                  ast.parse(source.read_text(encoding='utf-8-sig'), filename=str(source))
          '@ | python -
